
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "SpecialTopics"
version = "0.1.0"
description = "A machine learning system for prioritizing Common Vulnerabilities and Exposures (CVEs)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas",
    "numpy",
    "PyYAML",
    "scikit-learn",
    "scipy",
    "mlflow"
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
