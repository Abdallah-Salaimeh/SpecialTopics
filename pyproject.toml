
[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SpecialTopics"
version = "0.1.0"
description = "A machine learning system for prioritizing Common Vulnerabilities and Exposures (CVEs)"
requires-python = ">=3.13,<3.14"

dependencies = [
    "pandas==3.1.1",
    "numpy==2.5.4",
    "PyYAML==6.0.3",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
    "mlflow==3.18.0",
    "joblib==1.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
